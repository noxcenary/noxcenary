name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate frog-snake SVGs
        env:
          # contributionsCollection needs a token scoped to read the user,
          # which the default GITHUB_TOKEN usually does NOT have. Create a
          # classic PAT with the `read:user` scope, save it as a repo
          # secret named SNAKE_TOKEN, and this will pick it up.
          GITHUB_TOKEN: ${{ secrets.SNAKE_TOKEN }}
          GITHUB_LOGIN: ${{ github.repository_owner }}
        run: node generate-frog-snake.mjs

      - name: Clean stale output files
        run: |
          mkdir -p dist
          find dist -maxdepth 1 -type f ! -name 'github-snake.svg' ! -name 'github-snake-dark.svg' -delete

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
