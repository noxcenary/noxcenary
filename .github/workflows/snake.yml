name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate frog-snake SVGs
        env:
          # The default GITHUB_TOKEN can usually read a *public* contribution
          # graph for the repo owner. If this workflow fails with a GraphQL
          # permission error, create a classic PAT with the `read:user`
          # scope, save it as a repo secret (e.g. SNAKE_TOKEN), and swap
          # the line below for: GITHUB_TOKEN: ${{ secrets.SNAKE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_LOGIN: ${{ github.repository_owner }}
        run: node generate-frog-snake.mjs

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
