<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Monochrome ukiyo-e inspired wave footer">
  <rect width="1200" height="300" fill="#000000"/>

  <!-- Slow motion: the wave subtly drifts and breathes to mimic a calm sea. -->
  <style>
    .wave-motion { transform-origin: 600px 250px; }
    @media (prefers-reduced-motion: reduce) {
      .wave-motion { animation: none !important; }
    }
  </style>

  <g class="wave-motion">
  <!-- distant foam -->
  <path d="M0 270 C85 250 135 260 200 232 C260 205 305 202 365 222 C430 243 480 240 535 205 C590 171 640 155 696 174 C760 196 810 188 858 160 C918 125 982 116 1038 146 C1090 175 1138 178 1200 150 L1200 300 L0 300 Z" fill="#4a4a4a">
    <animate attributeName="opacity" values="0.88;1;0.88" dur="9s" repeatCount="indefinite" />
    </path>

  <!-- main rising wave -->
  <path d="M0 300 L0 235 C78 229 124 214 161 184 C207 147 235 78 291 55 C345 33 389 67 420 104 C452 143 466 170 505 179 C556 191 591 170 618 128 C646 84 665 45 713 29 C760 13 805 32 835 69 C862 102 874 142 916 162 C951 178 989 174 1024 157 C1060 140 1106 122 1150 134 C1182 143 1192 156 1200 166 L1200 300 Z" fill="#8a8a8a"/>

  <!-- shadow body of wave -->
  <path d="M0 300 L0 257 C83 251 143 225 193 178 C231 142 255 92 291 77 C330 60 367 83 397 123 C432 169 453 206 497 214 C559 226 603 189 636 139 C675 80 690 49 722 45 C762 40 794 70 812 104 C839 156 863 193 914 211 C972 232 1031 198 1070 171 C1101 150 1136 149 1160 161 C1180 171 1191 184 1200 196 L1200 300 Z" fill="#1f1f1f"/>

  <!-- white foam crest -->
  <path d="M252 104 C274 75 291 48 316 52 C334 54 347 72 355 92 C333 82 322 86 311 102 C303 114 290 128 276 133 C263 137 250 127 252 104 Z" fill="#f0f0f0"/>
  <path d="M311 79 C330 56 349 44 365 50 C380 56 389 70 392 87 C378 76 367 76 358 90 C350 103 342 118 328 122 C314 126 303 111 311 79 Z" fill="#d8d8d8"/>

  <path d="M666 76 C686 44 705 24 730 28 C755 32 770 50 779 72 C760 58 745 61 734 80 C723 98 708 111 692 109 C676 107 664 98 666 76 Z" fill="#efefef"/>
  <path d="M708 54 C726 29 744 19 760 26 C772 31 780 42 783 54 C769 47 759 50 751 61 C742 74 730 84 718 80 C706 77 701 68 708 54 Z" fill="#cfcfcf"/>

  <!-- claw-like foam fingers -->
  <g fill="none" stroke="#ededed" stroke-width="4" stroke-linecap="round">
    <path d="M292 89 C280 99 276 113 268 124"/>
    <path d="M305 78 C295 89 290 103 284 114"/>
    <path d="M320 70 C312 82 307 94 303 106"/>
    <path d="M685 67 C675 79 670 93 665 104"/>
    <path d="M701 52 C692 65 689 80 684 91"/>
    <path d="M718 43 C711 57 709 69 705 80"/>
  </g>

  <!-- wave contour lines -->
  <g fill="none" stroke="#bdbdbd" stroke-width="2.5" opacity="0.8">
    <path d="M24 276 C134 262 212 221 254 156 C279 118 295 99 323 105 C351 111 368 145 391 174"/>
    <path d="M85 292 C163 278 231 245 273 194 C299 163 312 145 337 150 C364 156 379 185 406 207"/>
    <path d="M448 270 C510 252 555 220 588 168 C620 118 631 92 654 94 C677 96 691 118 704 141"/>
    <path d="M742 247 C797 224 828 190 841 151 C850 124 865 109 887 116 C909 123 924 145 942 159"/>
    <path d="M932 270 C1000 249 1040 213 1077 188 C1108 167 1133 170 1163 190"/>
  </g>

  <!-- fine spray -->
  <g fill="#f2f2f2">
    <circle cx="261" cy="92" r="3"/><circle cx="278" cy="72" r="2"/><circle cx="298" cy="61" r="2.5"/>
    <circle cx="646" cy="70" r="2.5"/><circle cx="657" cy="53" r="2"/><circle cx="785" cy="80" r="2.5"/>
    <circle cx="802" cy="93" r="2"/><circle cx="1110" cy="145" r="2.5"/><circle cx="1132" cy="153" r="2"/>
  </g>

  <!-- subtle horizon -->
  <path d="M0 277 C120 270 175 269 244 273 C360 280 420 267 501 268 C613 269 690 281 784 273 C900 263 980 269 1065 271 C1120 273 1160 271 1200 268" fill="none" stroke="#666666" stroke-width="2"/>
    <!-- subtle horizontal drift -->
    <animateTransform attributeName="transform" type="translate" values="-7 0;7 0;-7 0" dur="16s" repeatCount="indefinite" />
  </g>
</svg>
