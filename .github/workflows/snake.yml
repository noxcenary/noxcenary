name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin ffmpeg

      - name: Generate contribution snake frames
        env:
          GITHUB_TOKEN: ${{ secrets.SNAKE_TOKEN }}
          GITHUB_LOGIN: ${{ github.repository_owner }}
          FRAMES: 240
        run: node pacman-contribution.mjs

      - name: Render frames to PNG
        run: |
          mkdir -p dist/png
          for f in dist/snake-frames/*.svg; do
            base=$(basename "$f" .svg)
            rsvg-convert -w 795 -o "dist/png/${base}.png" "$f"
          done

      - name: Encode animated GIF
        run: |
          ffmpeg -y -framerate 20 -i dist/png/frame-%03d.png \
            -vf "fps=20,split[s0][s1];[s0]palettegen=max_colors=128:stats_mode=diff[p];[s1][p]paletteuse=dither=sierra2_4a" \
            -loop 0 dist/github-snake.gif
          cp dist/github-snake.gif dist/github-snake-dark.gif

      - name: Clean temporary files
        run: rm -rf dist/snake-frames dist/png

      - name: Publish output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
